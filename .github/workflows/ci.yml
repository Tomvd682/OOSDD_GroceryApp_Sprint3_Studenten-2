name: CI

on:
  push:
    branches: [ develop, main, feature/** ]
  pull_request:
    branches: [ develop, main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Alleen het testproject herstellen (vermijdt MAUI workload)
      - name: Restore TestCore
        run: dotnet restore ./TestCore

      # Tests draaien + TRX-resultaat opslaan
      - name: Test (TRX output)
        run: dotnet test ./TestCore --configuration Release --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults --no-restore

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
